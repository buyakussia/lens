[workspace]
resolver = "2"
members = [
    "crates/lens-core",
    "crates/clip-core",
    "linux/common",
    "linux/lens",
    "linux/clipboard",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
lens-core = { path = "crates/lens-core" }
clip-core = { path = "crates/clip-core" }
linux-common = { path = "linux/common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "6"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gdk-x11 = { package = "gdk4-x11", version = "0.11" }
x11rb = "0.14"
async-channel = "2"
pulldown-cmark = { version = "0.13", default-features = false }
libc = "0.2"

# Маленькие и быстрые бинарники: меньше памяти на код и быстрее запуск.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.clippy]
# колбэки GTK естественно выглядят как RefCell<Option<Box<dyn Fn…>>>
type_complexity = "allow"
