name: Desktop builds

# Сборка Lens для macOS (Apple Silicon и Intel) и Windows.
# Запускается вручную или при теге вида v1.2.3; при теге файлы попадают в Releases, иначе — в артефакты запуска.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - os: macos-15-intel       # Intel
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust_target: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/lens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/lens/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/lens/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Copy vendored browser libraries
        run: npm run vendor

      - name: Build
        run: npx tauri build ${{ matrix.args }}

      - name: Upload macOS bundles
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: lens-${{ matrix.rust_target }}
          path: |
            desktop/lens/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            desktop/lens/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app

      - name: Upload Windows installers
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lens-windows
          path: |
            desktop/lens/src-tauri/target/release/bundle/nsis/*.exe
            desktop/lens/src-tauri/target/release/bundle/msi/*.msi

  release:
    # Публикует готовые установщики на странице Releases (только для тегов v*).
    # Выкладывает то, что собралось успешно, даже если одна из платформ упала.
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect installers
        run: |
          mkdir out
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -exec cp {} out/ \;
          ls -l out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --repo "${{ github.repository }}" \
            --title "Lens ${{ github.ref_name }}" \
            --notes "Установщики для macOS (Apple Silicon и Intel) и Windows. Сборки не подписаны: на macOS открывайте через правый клик → Открыть. Нужен установленный и авторизованный Claude Code."
